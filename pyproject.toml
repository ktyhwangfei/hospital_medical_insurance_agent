[project]
name = "hospital-medical-insurance-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=50.0.0",
    "openai>=2.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pymilvus>=3.0.0",
    "pyodbc>=5.3.0",
    "python-multipart",
    "requests>=2.34.1",
    "sentence-transformers>=5.5.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
    "fakeredis>=2.37.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
