# skill_manifest.yaml — Skill 声明文件
# 供 src/skill_infra/skill_loader.py 动态发现和加载

skill_id: settlement_explain_skill
skill_name: 结算解释技能
version: "2.0.0"

# ── 业务动作分类 ──────────────────────────────────────────────
# 参见：Business Action Specification V1.0
# Business Action 决定"做什么"，Business Object 决定"处理谁"
business_action: explain       # 解释：为什么（面向患者，解释已发生的事实）
business_object: settlement    # 结算：操作对象为医保结算数据

# ── 能力说明（概览页卡片展示）──
# 一句话描述本 Skill 做什么，供治理工作台概览页与目录展示。
description: >-
  医保住院结算费用逐项解释：按用户问到的费用项（统筹自付/起付线/大额自付/
  统筹支付/个人总支付/医保外费用）查询真实结算数据与结构化政策规则，
  生成带政策依据引用的自然语言解释。

# ── 语义层声明 ─────────────────────────────────────────────────
# 对齐语义层真实指标编码（Settlement 对象）。物理字段映射见各指标的
# source_field，与 field_mapping.yaml 的 db_source 一致。
# 注意：hospital_level 为派生/默认值（无对应数据源指标），不在此声明。
needed_objects:
  - object_code: "zydyxx"          # 住院待遇
    metrics:
      - bcqfje                      # 起付线
      - bcybnje                     # 医保内费用
    importance: "core"
  - object_code: "zyfdxx"          # 住院分段
    metrics:
      - bdtczfje                    # 统筹支付
      - bdtczf                      # 统筹自付
      - bddezfje                    # 大额支付
      - bddezf                      # 大额自付
      - bdgryf                      # 个人应付（≈个人总支付）
    importance: "core"
  - object_code: "zyjyxx"          # 住院交易
    metrics:
      - rylb                        # 人员类别
    importance: "core"
  - object_code: "djxx"            # 参保人登记
    metrics:
      - fund_type                   # 险种类型
      - yllb                        # 医疗类别
      - hospital_level              # 医院等级（常量，固定三级医院）
    importance: "core"
  - object_code: "zyfymx"          # 住院费用明细
    metrics:
      - ybwje                       # 医保外金额（自费项策略）
      - ybnje                       # 医保内金额
    importance: "optional"

# 对象版本锁定（阶段4）：
#   null / 缺省 = 跟随最新已发布版本（follow latest published）
#   指定版本号  = 锁定到该版本，对象重新发布后本 skill 不自动跟随，需显式升级
locked_versions:
  zydyxx: null
  zyfdxx: null
  zyjyxx: null
  djxx: null

# ── 路由配置 ──────────────────────────────────────────────────

# 关键词精简原则：只保留用户对医保人员会「说出口」的词
# 内部字段名（规则ID、条款标识、来源事实ID 等）从关键词表移除，
# 由 LLM 语义路由兜底。共约 130 → 25 个核心词。
supported_intents:
  # ── 费用类（用户最常问的核心词）──
  - 统筹自付
  - 起付线
  - 门槛费
  - 报销比例
  - 大额自付
  - 封顶线
  - 自费
  - 个人总支付
  - 医保内
  - 医保外
  - 报销
  - 统筹支付
  - 大病保险
  - 个人负担
  # ── 人群类（用户会提的身份）──
  - 职工医保
  - 居民医保
  - 退休
  - 在职
  # ── 场景类（用户表达困惑/求助）──
  - 为什么这么多
  - 怎么算的
  - 能报多少
  - 花了多少
  # ── 高频场景 ──
  - 结算
  - 费用
excluded_intents:
  # 对比类问法路由到 settlement_compare_skill（compare × settlement），
  # 本 skill 命中这些词时 confidence ×0.3 惩罚，避免抢占对比意图
  - 对比
  - 比较
  - 差异
  - 为什么这次
  - 跟上次

# ── 依赖声明 ──────────────────────────────────────────────────

required_settlement_fields:
  - zydyxx.bcqfje        # 起付线
  - zydyxx.bcybnje       # 医保内费用
  - zyfdxx.bdtczfje      # 统筹支付
  - zyfdxx.bdtczf        # 统筹自付
  - zyfdxx.bddezfje      # 大额支付
  - zyfdxx.bddezf        # 大额自付
  - zyfdxx.bdgryf        # 个人应付
  - zyjyxx.rylb          # 人员类别
  - djxx.fund_type       # 险种类型
  - djxx.yllb            # 医疗类别
  - djxx.hospital_level # 医院等级（常量，固定三级医院）

required_mcp:
  - settlement-data
  - structured-policy-rule

optional_mcp:
  - policy-vector-search
  - audit-trace

# ── 输出结构 ──────────────────────────────────────────────────

output_schema: schemas/output.schema.json

forbidden_output:
  - if t.
  - undefined
  - "null"
  - None
  - "NaN"
  - '{"ratio"'
  - embedding_text
  - "Milvus score"
  - yb_zyfdxx
  - yb_dyxxzy

# ── 测试用例 ──────────────────────────────────────────────────

test_cases:
  - tests/case_pooling_self_pay_1671213.yaml

# ── 执行契约（Execution Contract，概览页场景/指标展示的唯一来源）──
# version_service 从本字段原样读取并校验为 SkillExecutionContract；
# 治理工作台概览页据此渲染 Skill 卡片、场景网格与依赖指标。
# 按用户可能问到的费用项拆分 profiles，每项对齐一个 Strategy（见 strategies/）。
execution_contract:
  version: 2

  # 公共输入：几乎所有费用项场景都需要的数据依赖。
  # context_inputs 为运行时上下文（RuntimeContextCode 枚举）；
  # metric_inputs 为决定「适用哪些政策规则」的基础结算字段。
  common:
    context_inputs:
      - code: settlement_id
        alias: 结算登记号
        required: true
        purpose: 定位单次住院结算，查询真实结算数据
      - code: question
        alias: 用户问题
        required: true
        purpose: 识别用户想了解的具体费用项
    metric_inputs:
      - metric_code: zyjyxx.rylb
        alias: 人员类别
        purpose: 区分在职/退休，决定适用的人群比例规则
      - metric_code: djxx.fund_type
        alias: 参保险种
        purpose: 匹配险种政策（如城镇职工基本医疗保险）
      - metric_code: djxx.yllb
        alias: 医疗类别
        purpose: 匹配就医类型（如住院-普通住院）
      - metric_code: djxx.hospital_level
        alias: 医院等级
        purpose: 匹配医院级别政策（如三级医院）

  # 执行场景：按费用项拆分，与 strategies/registry.py 一一对应。
  profiles:
    - profile_id: pooling-self-pay-explanation
      name: 统筹自付解释
      purpose: 解释基本医保统筹段内按政策比例由个人承担的金额（不含起付线/大额自付/目录外自费）
      routing_hints:
        - 统筹自付
        - 统筹段自付
      metric_inputs:
        - metric_code: zyfdxx.bdtczf
          alias: 统筹自付金额
          purpose: 待解释的目标金额
        - metric_code: zydyxx.bcqfje
          alias: 起付线
          purpose: 区分起付线与统筹自付

    - profile_id: deductible-explanation
      name: 起付线解释
      purpose: 解释医保开始报销前需先由个人承担的固定金额，以及二次住院起付线减半等规则
      routing_hints:
        - 起付线
        - 门槛费
      metric_inputs:
        - metric_code: zydyxx.bcqfje
          alias: 起付线
          purpose: 待解释的目标金额

    - profile_id: large-amount-self-pay-explanation
      name: 大额自付解释
      purpose: 解释大额医疗互助基金段内按比例由个人承担的金额
      routing_hints:
        - 大额自付
        - 大额段自付
      metric_inputs:
        - metric_code: zyfdxx.bddezf
          alias: 大额自付金额
          purpose: 待解释的目标金额

    - profile_id: pooling-payment-explanation
      name: 统筹支付解释
      purpose: 解释基本医保统筹基金按政策比例为患者支付的金额（统筹基金帮您付的部分）
      routing_hints:
        - 统筹支付
        - 统筹基金支付
      metric_inputs:
        - metric_code: zyfdxx.bdtczfje
          alias: 统筹支付金额
          purpose: 待解释的目标金额

    - profile_id: personal-total-pay-explanation
      name: 个人总支付解释
      purpose: 解释本次住院个人承担的全部费用总和构成（起付线+统筹自付+大额自付+目录外自费等）
      routing_hints:
        - 个人总支付
        - 个人一共花了多少
        - 自费多少
      metric_inputs:
        - metric_code: zyfdxx.bdgryf
          alias: 个人总支付
          purpose: 待解释的目标金额（合计项）

    - profile_id: out-of-scope-explanation
      name: 医保外费用解释
      purpose: 解释不在医保目录范围、需患者全额自费的费用（目录外药品/自费耗材/特需服务等）
      routing_hints:
        - 医保外
        - 自费
        - 目录外
      metric_inputs:
        - metric_code: zyfymx.ybwje
          alias: 医保外金额
          purpose: 待解释的目标金额（全额自费部分）

# ── 前端展示配置 ──────────────────────────────────────────────

display:
  mode: single  # single | compare

  # 参保信息（输入上下文 — 决定了什么规则适用）
  # field 统一使用语义层指标编码（object.metric）
  profile:
    title: 您的参保信息
    items:
      - field: zyjyxx.rylb
        label: 人员类别
      - field: djxx.fund_type
        label: 参保类型
      - field: djxx.yllb
        label: 医疗类别
      - field: djxx.hospital_level
        label: 医院等级

  # 费用明细（输出字段 — 按业务含义分组）
  output:
    - group: 医保帮您付的
      items:
        - field: zyfdxx.bdtczfje
          label: 统筹基金支付
          format: money
        - field: zyfdxx.bddezfje
          label: 大额基金支付
          format: money

    - group: 您个人承担的
      items:
        - field: zydyxx.bcqfje
          label: 起付线
          format: money
          hint: 报销前个人全额承担
        - field: zyfdxx.bdtczf
          label: 统筹自付
          format: money
          highlight: true
          hint: 统筹段内按比例自付
        - field: zyfdxx.bddezf
          label: 大额自付
          format: money
          hint: 大额段内按比例自付

    - group: 合计
      items:
        - field: zyfdxx.bdgryf
          label: 个人总支付
          format: money
          hint: 以上所有个人承担项之和

  # 折叠区（默认关闭）
  collapsible:
    - policy_evidence   # 政策依据
    - calculation_trace # 计算过程（专业人员）
