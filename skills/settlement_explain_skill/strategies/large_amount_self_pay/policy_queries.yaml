# 大额自付政策查询计划
queries:
  - query_name: large_amount_segment_ratio
    required: true
    filters:
      insu_type: 城镇职工基本医疗保险
      med_type: 住院-普通住院
      rule_type: 支付比例
    psn_type_allow_all: true
    text_must_include_any:
      - 大额互助
      - 大额段
      - 大额医疗
      - 超过基本统筹封顶线
    description: 大额医疗互助段基金支付比例

  - query_name: large_amount_cap_limit
    required: false
    filters:
      insu_type: 城镇职工基本医疗保险
      med_type: 住院-普通住院
      rule_type: 封顶线
    text_must_include_any:
      - 大额互助
      - 大额段
    description: 大额医疗互助封顶线标准

  - query_name: retiree_large_amount_ratio
    required: false
    filters:
      insu_type: 城镇职工基本医疗保险
      med_type: 住院-普通住院
      psn_type: 退休人员
      rule_type: 计算公式
    text_must_include_all:
      - 退休人员
      - 大额
      - 个人支付
    description: 退休人员大额段自付比例规则
