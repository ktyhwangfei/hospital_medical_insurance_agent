# 个人总支付政策查询计划
# 查询与个人总支付构成相关的各项政策规则
queries:
  - query_name: deductible_tertiary_standard
    required: true
    filters:
      rule_type: 起付线
      hosp_lv: 三级医院
    description: 三级医院起付线标准（个人总支付的组成部分之一）

  - query_name: employee_inpatient_tertiary_segment_ratio
    required: true
    filters:
      insu_type: 城镇职工基本医疗保险
      med_type: 住院-普通住院
      hosp_lv: 三级医院
      rule_type: 支付比例
    psn_type_allow_all: true
    text_must_include_any:
      - 起付标准至3万元
      - 超过3万元至4万元
      - 超过4万元
    description: 统筹段分段支付比例（统筹自付的政策依据）

  - query_name: retiree_personal_ratio_formula
    required: false
    filters:
      insu_type: 城镇职工基本医疗保险
      med_type: 住院-普通住院
      psn_type: 退休人员
      rule_type: 计算公式
    text_must_include_all:
      - 退休人员
      - 个人支付比例
      - 60%
    description: 退休人员统筹自付折算规则

  - query_name: large_amount_self_pay_rule
    required: false
    filters:
      rule_type: 支付比例
    text_must_include_all:
      - 大额
      - 支付
    description: 大额自付相关政策（个人总支付的组成部分之一）
