# 医保外费用患者视角模板

conclusion_header: 【本次结论】
conclusion_with_amount: '本次结算中，您有 {amount} 元属于医保外费用（不在医保报销目录范围内的费用），需由您全额自费。'
conclusion_without_amount: '本次结算涉及医保外费用——不在医保报销目录范围内的费用，需由患者全额自费。'

what_is_header: 【什么是医保外费用】
what_is_template: |-
  医保外费用，是指不属于"医保三大目录"范围内的费用。

  医保三大目录包括：
  1. 药品目录：甲类（全部纳入报销范围）、乙类（先自付一定比例后纳入报销范围）、丙类（目录外，全额自费）
  2. 诊疗项目目录：如检查费、治疗费、手术费等，医保规定可报销的部分
  3. 医疗服务设施目录：如床位费等

  不在上述三大目录范围内的费用，就是医保外费用（也称"全自费"或"目录外费用"），需要患者全额承担。

why_header: 【为什么医保不报销这些】
why_template: |-
  医保基金的本质是"互助共济"，遵循"保基本"原则。医保三大目录划定了报销范围：

  - 目录内的费用：医保按政策比例报销（如统筹支付、统筹自付等）
  - 目录外的费用：不属于医保报销范围，需患者全额自费

  常见的医保外费用包括：
  - 丙类药品（如部分进口药、保健品、美容类药品）
  - 自费耗材（如部分进口支架、高端人工关节等超过医保限价的耗材）
  - 特需门诊/特需病房费用
  - 美容整形、体检等非治疗性项目
  - 超出医保支付限价的部分

evidence_header: 【政策依据】
evidence_intro: "根据已匹配到的医保目录范围政策："
no_policy: "当前未检索到医保目录范围的专项政策依据，以下内容基于医保通用规则进行解释。"

summary_header: 【一句话总结】
summary_template: |-
  医保外费用与统筹自付、起付线、大额自付不同。统筹自付、起付线、大额自付都属于"医保目录内的费用按政策由个人承担的部分"；而医保外费用是"根本不在医保目录内、需全额自费的费用"。两者的本质区别在于：前者在报销范围内，后者不在报销范围内。

relationship_header: 【本次金额关系】
relationship_items:
  - field: basic_pooling_self_pay
    label: 统筹自付
    description: "医保目录内费用按比例由个人承担的部分，与医保外费用的性质完全不同；"
  - field: deductible
    label: 起付线
    description: "医保目录内费用的报销门槛，医保外费用不参与起付线计算；"
  - field: large_amount_self_pay
    label: 大额自付
    description: "进入大额保障段后个人按比例承担的部分，也属于目录内费用；"
  - field: personal_total_pay
    label: 个人总支付
    description: "包含目录内的个人自付和目录外的全额自费。"
