money_tolerance: "0.01"
money_states: [non_zero, reported_zero, missing, not_applicable]
high_risk_actions: [退费, 冲正, 撤销结算, 重新结算]
always_confirm_actions: [撤销结算, 重新结算]
write_intent_terms: [帮我, 请, 执行, 办理, 进行, 立即, 马上, 给我, 给患者, 申请]
excluded_route_phrases: [如何办理异地, 怎么异地备案, 如何办理慢特病]
routing_priority:
  - transaction-status-and-refund
  - fee-item-scope-explanation
  - cross-region-and-institution
  - eligibility-and-special-benefit
  - deductible-and-annual-progress
  - reimbursement-and-cap-verification
  - payment-channel-verification
  - personal-liability-explanation
  - overall-settlement-verification

