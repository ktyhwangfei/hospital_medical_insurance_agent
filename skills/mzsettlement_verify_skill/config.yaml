profile_summaries:
  overall-settlement-verification: 已完成门诊结算总额和支付方金额勾稽。
  personal-liability-explanation: 已列示本次门诊结算单中的个人负担金额。
  payment-channel-verification: 已列示本次门诊各支付渠道，未盲目重复相加总分项。
  deductible-and-annual-progress: 已列示起付金额及本次结算前后年度累计。
  reimbursement-and-cap-verification: 已核验可证明的金额关系；比例和封顶结论以政策证据为准。
  fee-item-scope-explanation: 已列示门诊费用明细的医保内外和先自付事实。
  eligibility-and-special-benefit: 已列示资格标志与专项待遇实际支付。
  cross-region-and-institution: 已列示异地与医疗机构相关结算条件。
  transaction-status-and-refund: 已列示交易、结算和退费状态；未执行任何写操作。

