      - T_PersonCountPay
      - T_CashPay
      - T_BigPay
      - T_BCPay
      - T_JCPay
      - T_OfficalPay
      - T_BigillPay
      - NT_BasicPay
      - NT_CivilPay
      - NT_OtherPay
      - NT_AgencySumPay
      - RETIRE_OFFICER_PAY
      - TB_FeeIn
      - TA_FeeIn
      - TB_MZTimes
      - TA_MZTimes
      - TB_BigPay
      - TA_BigPay
      - TB_FeeAfterBig
      - TA_FeeAfterBig
      - TB_FeeInL1
      - TA_FeeInL1
      - TB_BigPayL1
      - TA_BigPayL1
      - TB_FeeAfterBigL1
      - TA_FeeAfterBigL1
      - T_BeyondBig
      - NT_OUT2_SCALE
      - NT_OUT2_PRICE
      - TB_BeyondFeeIn
      - TA_BeyondFeeIn
      - TB_BigillComm
      - TA_BigillComm
      - TB_BigillPay
      - TA_BigillPay
      - P_HospFlag
      - P_Official
      - PN_ChronicFlag
      - PN_IsChronicHosp
      - PN_ChronicCode
      - PN_NoRightReason
      - P_retirementflag
      - P_CivilFlag
      - P_CivilType
      - RETIRE_OFFICER_FLAG
      - T_GFBelongFlag
      - NT_AllSelfPayFlag
      - PN_OutTransaction
      - PN_NationFundType
      - T_CompHospFlag
      - T_SpSetlFlag
      - T_HasRefundmented
      - T_PartialReturnFlag
      - T_OraginalTradeNo
      - T_OraginalTradeDate
      - NP_Settle_State
      - SETL_DATE
      - NT_ReTradeFlag
