skill_id: mzsettlement_verify_skill
skill_name: 门诊结算结果核验
version: "1.0.1"
business_action: verify
business_object: settlement
description: >-
  基于门诊交易与费用明细，核验金额勾稽、个人负担、支付渠道、起付线、
  报销与封顶、待遇资格、异地结算及交易状态；政策不足时明确不确定性。

needed_objects:
  - object_code: mzjyxx
    importance: core
    metrics:
      - T_TradeDate
      - T_State
      - P_FundType
      - PN_PersonType
      - T_CureType
      - HospitalLevel
      - P_JCLevel
      - T_FeeAll
