apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medical-insurance-ai-agent
  labels:
    app: medical-insurance-ai-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medical-insurance-ai-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
