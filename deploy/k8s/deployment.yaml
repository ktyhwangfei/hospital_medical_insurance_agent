apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-insurance-ai-agent
  labels:
    app: medical-insurance-ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-insurance-ai-agent
  template:
    metadata:
      labels:
        app: medical-insurance-ai-agent
    spec:
      containers:
        - name: medical-insurance-ai-agent
          image: medical-insurance-ai-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: medical-insurance-ai-agent-config
            - secretRef:
                name: medical-insurance-ai-agent-secret
          env:
            - name: MODEL_GOVERNANCE_ENV
              value: dev
            - name: MODEL_GOVERNANCE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-insurance-ai-agent-secret
                  key: MODEL_GOVERNANCE_MASTER_KEY
          livenessProbe:
            httpGet:
              path: /api/v1/medical-insurance-ai-agent/version
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/medical-insurance-ai-agent/version
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
