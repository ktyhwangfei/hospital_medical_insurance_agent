apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-insurance-ai-agent
  labels:
    app: medical-insurance-ai-agent
spec:
  ingressClassName: nginx
  rules:
    - host: medical-ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medical-insurance-ai-agent
                port:
                  number: 80
