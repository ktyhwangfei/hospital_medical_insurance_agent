# 业务对象：医保政策 (Policy)
# L1 业务对象层定义 — 医保政策规则的定义维度
object_id: Policy
name: 医保政策
description: 医保政策规则的定义维度，包括险种、医疗类别、支付比例、起付金额、封顶金额、金额分段、时间周期等。
fields:
  - insu_type          # 险种类别
  - med_type           # 医疗类别（住院、门诊等）
  - payment_ratio      # 支付比例
  - deductible_amount  # 起付金额
  - cap_amount         # 封顶金额
  - amount_band        # 金额分段
  - time_period        # 时间周期
  - rule_id            # 规则ID（元指标）
  - rule_type          # 规则类型（起付线/支付比例/封顶线/计算公式）
  - rule_value         # 规则值
  - source_text        # 原始政策文本（溯源）
